<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Minha TV Online</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:#0b0b0b;border-bottom:1px solid #222;padding:12px 14px}
.top{display:flex;align-items:center;gap:10px;max-width:1400px;margin:auto}
.logo{font-size:20px;font-weight:800;white-space:nowrap}
.logo b{color:#f22}
.search{flex:1;background:#171717;border:1px solid #303030;color:#fff;border-radius:22px;padding:11px 16px;outline:0}
.search:focus{border-color:#777}
.btn{border:0;background:#202020;color:#fff;border-radius:20px;padding:10px 14px;cursor:pointer}
.btn:hover{background:#303030}
main{max-width:1400px;margin:auto;padding:18px 14px 60px}
.hero{background:linear-gradient(135deg,#161616,#0d0d0d);border:1px solid #252525;border-radius:16px;padding:18px;margin-bottom:24px}
.hero h1{margin:0 0 5px;font-size:25px}
.hero p{margin:0;color:#aaa;font-size:14px}
.section{margin:25px 0 34px}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-title h2{font-size:19px;margin:0}
.count{color:#888;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{position:relative;background:#121212;border:1px solid #242424;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#555}
.cover{position:relative;aspect-ratio:16/9;background:#1c1c1c;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.live{position:absolute;top:8px;left:8px;background:#e50914;color:#fff;font-weight:bold;font-size:11px;padding:5px 7px;border-radius:5px;box-shadow:0 0 10px #000}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:4px}
.star{position:absolute;right:7px;top:7px;width:31px;height:31px;border:0;border-radius:50%;background:#000b;color:#aaa;font-size:18px;cursor:pointer;z-index:3}
.star.on{color:#ffd21c}
.info{padding:10px}
.name{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{font-size:11px;color:#777;margin-top:4px}
.empty{padding:35px;text-align:center;color:#777}
#playerScreen{display:none;position:fixed;inset:0;background:#000;z-index:100;overflow:auto}
.playerTop{height:55px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#101010}
.back{background:#222;color:#fff;border:0;border-radius:18px;padding:9px 14px;cursor:pointer}
.playerTitle{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playerWrap{max-width:1200px;margin:0 auto}
.video{width:100%;aspect-ratio:16/9;background:#000}
.video iframe{width:100%;height:100%;border:0}
.playerInfo{padding:14px}
.playerLive{display:inline-block;background:#e50914;padding:5px 8px;border-radius:5px;font-size:12px;font-weight:bold}
.playerInfo h2{margin:10px 0 5px}
.playerInfo p{color:#999;margin:0}
.notice{margin:15px 0;padding:12px;border:1px solid #343434;background:#151515;border-radius:9px;color:#bbb;font-size:13px}
.favOnly{display:none}
@media(max-width:650px){
 .logo{font-size:17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .card{border-radius:9px}.info{padding:8px}.name{font-size:13px}
 .hero{padding:14px}.hero h1{font-size:20px}
}
@media(min-width:1100px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">📺 <b>MINHA</b> TV ONLINE</div>
    <input id="search" class="search" placeholder="Pesquisar canal..." autocomplete="off">
    <button class="btn" id="favBtn">⭐ Favoritos</button>
  </div>
</header>

<main>
  <div class="hero">
    <h1>📺 Canais ao vivo</h1>
    <p>Escolha um canal para assistir dentro do próprio site.</p>
  </div>
  <div id="conteudo"><div class="empty">Carregando canais...</div></div>
</main>

<div id="playerScreen">
  <div class="playerTop">
    <button class="back" onclick="fecharPlayer()">← Voltar</button>
    <div class="playerTitle" id="playerTitle"></div>
  </div>
  <div class="playerWrap">
    <div class="video" id="videoBox"></div>
    <div class="playerInfo">
      <span class="playerLive">🔴 AO VIVO</span>
      <h2 id="playerName"></h2>
      <p id="playerHandle"></p>
      <div class="notice" id="playerNotice"></div>
    </div>
  </div>
</div>

<script>
const JSON_URL="https://raw.githubusercontent.com/Isac-Arqueiro/mylist/refs/heads/main/canaisyoutube.json";

let dados=null;
let canais=[];
let favoritos=JSON.parse(localStorage.getItem("meusFavoritosYT")||"[]");
let somenteFavoritos=false;

const $=id=>document.getElementById(id);

async function carregar(){
  try{
    const r=await fetch(JSON_URL+"?v="+Date.now());
    if(!r.ok) throw new Error("JSON não carregou");
    dados=await r.json();
    canais=[];
    (dados.categorias||[]).forEach(cat=>{
      (cat.canais||[]).forEach(c=>{
        c.categoria=cat.nome;
        canais.push(c);
      });
    });
    renderizar();
  }catch(e){
    $("conteudo").innerHTML='<div class="empty">Não foi possível carregar o canais.json.</div>';
  }
}

function isFav(id){return favoritos.includes(id)}

function alternarFav(id,ev){
  if(ev) ev.stopPropagation();
  if(isFav(id)) favoritos=favoritos.filter(x=>x!==id);
  else favoritos.push(id);
  localStorage.setItem("meusFavoritosYT",JSON.stringify(favoritos));
  renderizar();
}

function imagem(c){
  return c.capa || (c.videoId ? "https://img.youtube.com/vi/"+c.videoId+"/hqdefault.jpg" : "");
}

function card(c){
  const f=isFav(c.id);
  return `
  <div class="card" onclick="abrirCanal('${esc(c.id)}')">
    <div class="cover">
      <img src="${esc(imagem(c))}" loading="lazy" onerror="this.style.display='none'">
      <div class="live"><span class="live-dot"></span>AO VIVO</div>
      <button class="star ${f?'on':''}" onclick="alternarFav('${esc(c.id)}',event)">${f?'★':'☆'}</button>
    </div>
    <div class="info">
      <div class="name">${esc(c.nome)}</div>
      <div class="handle">${esc(c.handle||c.categoria||"Canal")}</div>
    </div>
  </div>`;
}

function renderizar(){
  const q=$("search").value.trim().toLowerCase();
  let cats=dados.categorias||[];

  if(somenteFavoritos){
    const fav=canais.filter(c=>isFav(c.id) && (!q || (c.nome+" "+(c.handle||"")).toLowerCase().includes(q)));
    $("conteudo").innerHTML=fav.length
      ? `<div class="section"><div class="section-title"><h2>⭐ FAVORITOS</h2><span class="count">${fav.length}</span></div><div class="grid">${fav.map(card).join("")}</div></div>`
      : '<div class="empty">Nenhum favorito encontrado.</div>';
    return;
  }

  let html="";
  cats.forEach(cat=>{
    const lista=(cat.canais||[]).filter(c=>{
      const texto=(c.nome+" "+(c.handle||"")+" "+cat.nome).toLowerCase();
      return !q || texto.includes(q);
    });
    if(!lista.length)return;
    html+=`<section class="section"><div class="section-title"><h2>${esc(cat.nome)}</h2><span class="count">${lista.length} canais</span></div><div class="grid">${lista.map(c=>{
      c.categoria=cat.nome; return card(c);
    }).join("")}</div></section>`;
  });
  $("conteudo").innerHTML=html||'<div class="empty">Nenhum canal encontrado.</div>';
}

function abrirCanal(id){
  const c=canais.find(x=>x.id===id);
  if(!c)return;
  $("playerTitle").textContent=c.nome;
  $("playerName").textContent=c.nome;
  $("playerHandle").textContent=c.handle||"";
  $("playerScreen").style.display="block";
  document.body.style.overflow="hidden";

  if(c.videoId){
    $("videoBox").innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(c.videoId)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    $("playerNotice").textContent="Transmissão carregada pelo player incorporado do YouTube.";
  }else{
    $("videoBox").innerHTML=`
      <div style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#101010">
        <div style="font-size:45px">🔴</div>
        <strong>${esc(c.nome)}</strong>
        <span style="color:#888;font-size:13px">A transmissão ao vivo atual deste canal precisa de um videoId.</span>
      </div>`;
    $("playerNotice").textContent="Este registro do JSON possui apenas o endereço @canal/live. O YouTube não fornece o videoId atual diretamente ao JavaScript do navegador. Quando você colocar o videoId atual no JSON, o player abrirá automaticamente.";
  }
}

function fecharPlayer(){
  $("videoBox").innerHTML="";
  $("playerScreen").style.display="none";
  document.body.style.overflow="";
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

$("search").addEventListener("input",renderizar);
$("favBtn").addEventListener("click",()=>{
  somenteFavoritos=!somenteFavoritos;
  $("favBtn").textContent=somenteFavoritos?"📺 Todos":"⭐ Favoritos";
  renderizar();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape")fecharPlayer();
});

carregar();
</script>
</body>
</html>
