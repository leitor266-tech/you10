<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#080808">

<title>Minha TV Online</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

/* =====================================================
   CABEÇALHO
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#0b0b0b;
  border-bottom:1px solid #252525;
  padding:10px 14px;
}

.top{
  display:flex;
  align-items:center;
  gap:10px;
  max-width:1400px;
  margin:auto;
}

.logo{
  font-size:20px;
  font-weight:bold;
  white-space:nowrap;
}

.logo b{
  color:#e50914;
}

.search{
  flex:1;
  min-width:100px;
  background:#171717;
  border:2px solid #303030;
  color:#fff;
  border-radius:22px;
  padding:10px 15px;
  outline:none;
  font-size:14px;
}

.search:focus{
  border-color:#e50914;
}

.btn{
  border:2px solid transparent;
  background:#202020;
  color:#fff;
  border-radius:20px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:bold;
  white-space:nowrap;
}

.btn:hover,
.btn:focus{
  background:#333;
  border-color:#e50914;
  outline:none;
}

/* =====================================================
   CONTEÚDO
===================================================== */

main{
  max-width:1400px;
  margin:auto;
  padding:14px 14px 60px;
}

.hero{
  background:#121212;
  border:1px solid #282828;
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.hero h1{
  margin:0 0 5px;
  font-size:23px;
}

.hero p{
  margin:0;
  color:#999;
  font-size:13px;
}

/* =====================================================
   CATEGORIAS
===================================================== */

.categoriesBox{
  margin-bottom:20px;
}

.categoriesTitle{
  font-size:17px;
  font-weight:bold;
  margin-bottom:9px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 2px 10px;
  -webkit-overflow-scrolling:touch;
}

.categoryBtn{
  flex:0 0 auto;
  border:2px solid #292929;
  background:#181818;
  color:#ddd;
  border-radius:20px;
  padding:9px 15px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.categoryBtn:hover,
.categoryBtn:focus{
  outline:none;
  border-color:#777;
  background:#292929;
  color:#fff;
}

.categoryBtn.active{
  background:#e50914;
  border-color:#e50914;
  color:#fff;
}

/* =====================================================
   SEÇÕES
===================================================== */

.section{
  margin:20px 0 28px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.section-title h2{
  font-size:18px;
  margin:0;
}

.count{
  color:#888;
  font-size:12px;
}

/* =====================================================
   GRID
===================================================== */

.grid{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px,1fr)
    );
  gap:12px;
}

/* =====================================================
   CARD
===================================================== */

.card{
  position:relative;
  background:#121212;
  border:2px solid #242424;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  outline:none;
}

.card:hover{
  border-color:#555;
}

.card:focus{
  border-color:#e50914;
  background:#191919;
  outline:none;
}

.card.selected{
  border-color:#e50914;
}

/* =====================================================
   CAPA
===================================================== */

.cover{
  position:relative;
  aspect-ratio:16/9;
  background:#1b1b1b;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  color:#555;
}

.live{
  position:absolute;
  top:7px;
  left:7px;
  background:#e50914;
  color:#fff;
  font-weight:bold;
  font-size:10px;
  padding:5px 7px;
  border-radius:4px;
}

.offline{
  position:absolute;
  top:7px;
  left:7px;
  background:#444;
  color:#ddd;
  font-weight:bold;
  font-size:10px;
  padding:5px 7px;
  border-radius:4px;
}

.live-dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  margin-right:4px;
}

.star{
  position:absolute;
  right:6px;
  top:6px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#000b;
  color:#aaa;
  font-size:20px;
  cursor:pointer;
  z-index:3;
}

.star:focus{
  outline:2px solid #fff;
}

.star.on{
  color:#ffd21c;
}

/* =====================================================
   INFORMAÇÕES
===================================================== */

.info{
  padding:9px;
}

.name{
  font-weight:bold;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.handle{
  font-size:10px;
  color:#777;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  font-size:10px;
  color:#777;
  margin-top:6px;
}

.status.online{
  color:#e50914;
}

/* =====================================================
   ESTADOS
===================================================== */

.empty{
  padding:35px;
  text-align:center;
  color:#777;
}

.loading{
  padding:40px;
  text-align:center;
  color:#888;
}

/* =====================================================
   PLAYER
===================================================== */

#playerScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  overflow:auto;
}

.playerTop{
  height:55px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:#101010;
  border-bottom:1px solid #252525;
}

.back{
  background:#222;
  color:#fff;
  border:2px solid transparent;
  border-radius:18px;
  padding:8px 14px;
  cursor:pointer;
  font-weight:bold;
}

.back:hover,
.back:focus{
  background:#333;
  border-color:#e50914;
  outline:none;
}

.playerTitle{
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.playerWrap{
  max-width:1200px;
  margin:0 auto;
}

.video{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

.video iframe{
  width:100%;
  height:100%;
  border:0;
}

.playerInfo{
  padding:14px;
}

.playerLive{
  display:inline-block;
  background:#e50914;
  padding:5px 8px;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
}

.playerInfo h2{
  margin:10px 0 5px;
}

.playerInfo p{
  color:#999;
  margin:0;
}

.notice{
  margin:15px 0;
  padding:12px;
  border:1px solid #343434;
  background:#151515;
  border-radius:8px;
  color:#bbb;
  font-size:13px;
}

.playerButton{
  display:inline-block;
  border:2px solid transparent;
  background:#e50914;
  color:#fff;
  border-radius:20px;
  padding:10px 17px;
  cursor:pointer;
  margin-top:12px;
  font-weight:bold;
}

.playerButton:focus{
  outline:none;
  border-color:#fff;
}

/* =====================================================
   AJUSTES PARA TV
===================================================== */

@media(max-width:900px){

  .logo{
    font-size:17px;
  }

  .grid{
    grid-template-columns:
      repeat(4,minmax(0,1fr));
  }

}

@media(max-width:650px){

  header{
    padding:8px;
  }

  .top{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
    font-size:17px;
  }

  .search{
    width:100%;
    order:2;
  }

  .btn{
    order:3;
  }

  main{
    padding:10px 8px 40px;
  }

  .hero{
    padding:13px;
  }

  .hero h1{
    font-size:19px;
  }

  .grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .card{
    border-radius:8px;
  }

  .info{
    padding:7px;
  }

  .name{
    font-size:12px;
  }

}

@media(min-width:1100px){

  .grid{
    grid-template-columns:
      repeat(6,minmax(0,1fr));
  }

}

</style>

</head>

<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

<div class="top">

<div class="logo">
📺 <b>MINHA</b> TV ONLINE
</div>

<input
  id="search"
  class="search"
  placeholder="Pesquisar canal..."
  autocomplete="off">

<button
  class="btn"
  id="favBtn"
  type="button">
⭐ Favoritos
</button>

</div>

</header>


<!-- =====================================================
     PRINCIPAL
===================================================== -->

<main>

<div class="hero">

<h1>
📺 Canais ao vivo
</h1>

<p>
Use as setas do controle e pressione OK para assistir.
</p>

</div>


<!-- =====================================================
     CATEGORIAS
===================================================== -->

<div class="categoriesBox">

<div class="categoriesTitle">
Categorias
</div>

<div
  id="categories"
  class="categories">

  <button
    class="categoryBtn active"
    data-category="TODOS"
    type="button">

    📺 Todos

  </button>

</div>

</div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div id="conteudo">

<div class="loading">
Carregando canais...
</div>

</div>

</main>


<!-- =====================================================
     PLAYER
===================================================== -->

<div id="playerScreen">

<div class="playerTop">

<button
  class="back"
  id="backButton"
  type="button">

← Voltar

</button>

<div
  class="playerTitle"
  id="playerTitle">
</div>

</div>


<div class="playerWrap">

<div
  class="video"
  id="videoBox">
</div>


<div class="playerInfo">

<span class="playerLive">
🔴 AO VIVO
</span>

<h2 id="playerName">
</h2>

<p id="playerHandle">
</p>

<div
  class="notice"
  id="playerNotice">
</div>

</div>

</div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

var JSON_URL =
"https://raw.githubusercontent.com/leitor266-tech/you10/main/canaisyout.json";

var API_URL =
"api.php";

var REFRESH_LIVE =
60000;


/* =====================================================
   ESTADO
===================================================== */

var dados = null;

var canais = [];

var categoriaAtual = "TODOS";

var somenteFavoritos = false;

var favoritos = [];

var ultimoCanalId = "";

var focoCategoria = true;


/* =====================================================
   FAVORITOS
===================================================== */

try{

  favoritos =
    JSON.parse(
      localStorage.getItem(
        "meusFavoritosYT"
      ) || "[]"
    );

}
catch(e){

  favoritos = [];

}


/* =====================================================
   HELPERS
===================================================== */

function $(id){

  return document.getElementById(id);

}


function esc(valor){

  return String(
    valor == null ? "" : valor
  ).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m];

    }
  );

}


function isFav(id){

  return favoritos.indexOf(
    String(id)
  ) !== -1;

}


/* =====================================================
   NORMALIZA
===================================================== */

function normalizar(c){

  return {

    id:
      String(
        c.id ||
        c.nome ||
        c.url ||
        ""
      ),

    nome:
      c.nome ||
      c.titulo ||
      "Canal",

    url:
      c.url ||
      "",

    categoria:
      c.categoria ||
      "Canais",

    videoId:
      c.videoId ||
      "",

    online:null,

    resolved:false,

    videoTitle:"",

    thumbnail:""

  };

}


/* =====================================================
   CARREGAR JSON
===================================================== */

function carregar(){

  fetch(
    JSON_URL +
    "?v=" +
    new Date().getTime(),
    {
      cache:"no-store"
    }
  )
  .then(
    function(r){

      if(!r.ok){

        throw new Error(
          "JSON não carregou: " +
          r.status
        );

      }

      return r.json();

    }
  )
  .then(
    function(json){

      dados = json;

      canais = [];

      if(
        Array.isArray(
          dados.categorias
        )
      ){

        dados.categorias.forEach(
          function(cat){

            var lista =
              cat.canais || [];

            lista.forEach(
              function(c){

                var canal =
                  normalizar(c);

                canal.categoria =
                  cat.nome ||
                  "Canais";

                canais.push(canal);

              }
            );

          }
        );

      }

      if(!canais.length){

        throw new Error(
          "Nenhum canal encontrado."
        );

      }

      criarCategorias();

      renderizar();

    }
  )
  .catch(
    function(e){

      console.log(e);

      $("conteudo").innerHTML =

        '<div class="empty">' +
        'Não foi possível carregar os canais.' +
        '<br><br>' +
        '<small>' +
        esc(e.message) +
        '</small>' +
        '</div>';

    }
  );

}


/* =====================================================
   CATEGORIAS
===================================================== */

function criarCategorias(){

  var box =
    $("categories");

  box.innerHTML = "";

  adicionarBotaoCategoria(
    "TODOS",
    "📺 Todos"
  );

  adicionarBotaoCategoria(
    "FAVORITOS",
    "⭐ Favoritos"
  );

  var nomes = [];

  canais.forEach(
    function(c){

      if(
        nomes.indexOf(
          c.categoria
        ) === -1
      ){

        nomes.push(
          c.categoria
        );

      }

    }
  );

  nomes.forEach(
    function(nome){

      adicionarBotaoCategoria(
        nome,
        nome
      );

    }
  );

}


function adicionarBotaoCategoria(
  valor,
  texto
){

  var btn =
    document.createElement(
      "button"
    );

  btn.className =
    "categoryBtn";

  if(
    valor === categoriaAtual
  ){

    btn.className +=
      " active";

  }

  btn.setAttribute(
    "data-category",
    valor
  );

  btn.setAttribute(
    "type",
    "button"
  );

  btn.innerHTML =
    esc(texto);

  btn.onclick =
    function(){

      selecionarCategoria(
        valor
      );

    };

  $("categories")
    .appendChild(btn);

}


function selecionarCategoria(
  categoria
){

  categoriaAtual =
    categoria;

  somenteFavoritos =
    categoria === "FAVORITOS";

  var botoes =
    $("categories")
    .getElementsByTagName(
      "button"
    );

  var i;

  for(
    i=0;
    i<botoes.length;
    i++
  ){

    if(
      botoes[i]
        .getAttribute(
          "data-category"
        ) === categoria
    ){

      botoes[i]
        .className =
        "categoryBtn active";

    }
    else{

      botoes[i]
        .className =
        "categoryBtn";

    }

  }

  renderizar();

}


/* =====================================================
   FAVORITO
===================================================== */

function alternarFav(
  id,
  ev
){

  if(ev){

    ev.stopPropagation();

  }

  id = String(id);

  var pos =
    favoritos.indexOf(id);

  if(pos !== -1){

    favoritos.splice(
      pos,
      1
    );

  }
  else{

    favoritos.push(id);

  }

  try{

    localStorage.setItem(
      "meusFavoritosYT",
      JSON.stringify(
        favoritos
      )
    );

  }
  catch(e){}

  renderizar();

}


/* =====================================================
   EXTRAI VIDEO ID
===================================================== */

function extrairVideoId(url){

  if(!url)
    return "";

  try{

    var u =
      new URL(url);

    var v =
      u.searchParams.get("v");

    if(
      v &&
      /^[A-Za-z0-9_-]{11}$/.test(v)
    ){

      return v;

    }

    if(
      u.hostname.indexOf(
        "youtu.be"
      ) !== -1
    ){

      var id =
        u.pathname
        .replace(
          /^\//,
          ""
        )
        .substring(
          0,
          11
        );

      if(
        /^[A-Za-z0-9_-]{11}$/.test(id)
      ){

        return id;

      }

    }

  }
  catch(e){}

  return "";

}


/* =====================================================
   CARD
===================================================== */

function card(c){

  var fav =
    isFav(c.id);

  var imagem =
    c.thumbnail;

  if(
    !imagem &&
    c.videoId
  ){

    imagem =
      "https://img.youtube.com/vi/" +
      c.videoId +
      "/hqdefault.jpg";

  }

  var status = "";

  if(
    c.online === true
  ){

    status =
      '<div class="live">' +
      '<span class="live-dot"></span>' +
      'AO VIVO' +
      '</div>';

  }
  else if(
    c.online === false
  ){

    status =
      '<div class="offline">' +
      'OFFLINE' +
      '</div>';

  }
  else{

    status =
      '<div class="live">' +
      '<span class="live-dot"></span>' +
      'AO VIVO' +
      '</div>';

  }

  var imagemHtml =
    imagem

    ?

    '<img src="' +
    esc(imagem) +
    '" loading="lazy" ' +
    'onerror="this.style.display=\'none\'">'

    :

    '<div class="placeholder">📺</div>';

  return (

    '<div ' +

      'class="card" ' +

      'tabindex="0" ' +

      'data-channel-id="' +
      esc(c.id) +
      '" ' +

      'onclick="abrirCanal(\'' +
      esc(c.id) +
      '\')" ' +

      'onkeydown="teclaCard(event,\'' +
      esc(c.id) +
      '\')">' +

      '<div class="cover">' +

        imagemHtml +

        status +

        '<button ' +
          'class="star ' +
          (fav ? "on" : "") +
          '" ' +
          'type="button" ' +
          'onclick="alternarFav(\'' +
          esc(c.id) +
          '\',event)">' +

          (fav ? "★" : "☆") +

        '</button>' +

      '</div>' +

      '<div class="info">' +

        '<div class="name">' +
          esc(c.nome) +
        '</div>' +

        '<div class="handle">' +
          esc(c.url) +
        '</div>' +

        '<div class="status ' +
          (
            c.online === true
            ? "online"
            : ""
          ) +
        '">' +

          (
            c.online === true
            ? "Transmissão disponível"
            : c.online === false
            ? "Nenhuma live no momento"
            : "Verificando transmissão..."
          ) +

        '</div>' +

      '</div>' +

    '</div>'

  );

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizar(){

  var q =
    $("search")
      .value
      .trim()
      .toLowerCase();

  var lista = [];

  canais.forEach(
    function(c){

      var pertence = false;

      if(
        categoriaAtual === "TODOS"
      ){

        pertence = true;

      }
      else if(
        categoriaAtual === "FAVORITOS"
      ){

        pertence =
          isFav(c.id);

      }
      else{

        pertence =
          c.categoria ===
          categoriaAtual;

      }

      if(!pertence)
        return;

      var texto =
        (
          c.nome +
          " " +
          c.url +
          " " +
          c.categoria
        ).toLowerCase();

      if(
        q &&
        texto.indexOf(q) === -1
      ){

        return;

      }

      lista.push(c);

    }
  );

  if(!lista.length){

    $("conteudo").innerHTML =
      '<div class="empty">' +
      'Nenhum canal encontrado.' +
      '</div>';

    return;

  }

  var titulo =
    categoriaAtual === "TODOS"
    ? "📺 TODOS OS CANAIS"
    : categoriaAtual === "FAVORITOS"
    ? "⭐ FAVORITOS"
    : categoriaAtual;

  var html =

    '<section class="section">' +

      '<div class="section-title">' +

        '<h2>' +
          esc(titulo) +
        '</h2>' +

        '<span class="count">' +
          lista.length +
          ' canais' +
        '</span>' +

      '</div>' +

      '<div class="grid">' +

        lista.map(
          card
        ).join("") +

      '</div>' +

    '</section>';

  $("conteudo")
    .innerHTML =
    html;

}


/* =====================================================
   TECLADO DO CARD
===================================================== */

function teclaCard(
  event,
  id
){

  var key =
    event.key;

  if(
    key === "Enter" ||
    key === " "
  ){

    event.preventDefault();

    abrirCanal(id);

    return;

  }

}


/* =====================================================
   RESOLVE CANAL
===================================================== */

function resolverCanal(c){

  if(c.resolved){

    return Promise.resolve(c);

  }

  var idDireto =
    c.videoId ||
    extrairVideoId(
      c.url
    );

  if(idDireto){

    c.videoId =
      idDireto;

    c.online = true;

    c.resolved = true;

    c.thumbnail =
      "https://img.youtube.com/vi/" +
      idDireto +
      "/hqdefault.jpg";

    return Promise.resolve(c);

  }

  return fetch(
    API_URL +
    "?url=" +
    encodeURIComponent(
      c.url
    ) +
    "&t=" +
    new Date().getTime(),
    {
      cache:"no-store"
    }
  )
  .then(
    function(r){

      if(!r.ok){

        throw new Error(
          "Erro HTTP " +
          r.status
        );

      }

      return r.json();

    }
  )
  .then(
    function(data){

      if(
        data.ok &&
        data.online &&
        data.videoId
      ){

        c.videoId =
          data.videoId;

        c.online =
          true;

        c.videoTitle =
          data.title ||
          "";

        c.thumbnail =
          data.thumbnail ||
          (
            "https://img.youtube.com/vi/" +
            data.videoId +
            "/hqdefault.jpg"
          );

      }
      else{

        c.online =
          false;

      }

      c.resolved =
        true;

      return c;

    }
  )
  .catch(
    function(e){

      console.log(
        c.nome,
        e
      );

      c.online =
        false;

      c.resolved =
        true;

      return c;

    }
  );

}


/* =====================================================
   ABRIR CANAL
===================================================== */

function abrirCanal(id){

  var c =
    canais.find(
      function(x){

        return String(x.id) ===
          String(id);

      }
    );

  if(!c)
    return;

  ultimoCanalId =
    c.id;

  $("playerScreen")
    .style.display =
    "block";

  document.body.style.overflow =
    "hidden";

  $("playerTitle")
    .textContent =
    c.nome;

  $("playerName")
    .textContent =
    c.nome;

  $("playerHandle")
    .textContent =
    c.url;

  $("videoBox").innerHTML =

    '<div style="' +
      'height:100%;' +
      'display:flex;' +
      'align-items:center;' +
      'justify-content:center;' +
      'background:#101010;' +
      'color:#888;' +
      'font-size:16px;' +
    '">' +

      '🔎 Procurando transmissão...' +

    '</div>';

  $("playerNotice")
    .textContent =
    "Verificando a transmissão atual...";

  resolverCanal(c)
    .then(
      function(){

        renderizar();

        if(
          c.online === true &&
          c.videoId
        ){

          $("videoBox").innerHTML =

            '<iframe ' +

              'src="https://www.youtube.com/embed/' +
              encodeURIComponent(
                c.videoId
              ) +
              '?autoplay=1&rel=0" ' +

              'title="' +
              esc(c.nome) +
              '" ' +

              'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" ' +

              'allowfullscreen>' +

            '</iframe>';

          $("playerNotice")
            .textContent =
            "Transmissão ao vivo carregada.";

          return;

        }

        $("videoBox").innerHTML =

          '<div style="' +
            'height:100%;' +
            'display:flex;' +
            'align-items:center;' +
            'justify-content:center;' +
            'flex-direction:column;' +
            'gap:12px;' +
            'background:#101010;' +
            'text-align:center;' +
            'padding:20px;' +
          '">' +

            '<div style="font-size:50px">📺</div>' +

            '<strong>' +
              esc(c.nome) +
            '</strong>' +

            '<span style="color:#888;font-size:13px">' +
              'Este canal não está transmitindo ao vivo neste momento.' +
            '</span>' +

            '<button ' +
              'class="playerButton" ' +
              'id="youtubeButton" ' +
              'type="button">' +

              'Abrir canal no YouTube' +

            '</button>' +

          '</div>';

        $("youtubeButton").onclick =
          function(){

            window.open(
              c.url,
              "_blank"
            );

          };

        $("playerNotice")
          .textContent =
          "Nenhuma transmissão ao vivo ativa foi encontrada.";

      }
    );

}


/* =====================================================
   FECHAR PLAYER
===================================================== */

function fecharPlayer(){

  $("videoBox")
    .innerHTML = "";

  $("playerScreen")
    .style.display =
    "none";

  document.body.style.overflow =
    "";

  setTimeout(
    function(){

      focarUltimoCanal();

    },
    100
  );

}


/* =====================================================
   FOCO NO ÚLTIMO CANAL
===================================================== */

function focarUltimoCanal(){

  if(!ultimoCanalId)
    return;

  var cards =
    document.getElementsByClassName(
      "card"
    );

  var i;

  for(
    i=0;
    i<cards.length;
    i++
  ){

    if(
      String(
        cards[i]
          .getAttribute(
            "data-channel-id"
          )
      ) ===
      String(ultimoCanalId)
    ){

      cards[i].focus();

      return;

    }

  }

}


/* =====================================================
   BUSCA
===================================================== */

$("search")
  .addEventListener(
    "input",
    function(){

      renderizar();

    }
  );


/* =====================================================
   CONTROLE REMOTO
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    var key =
      e.key ||
      e.keyCode;

    /*
      Teclas mais comuns:

      37 = esquerda
      38 = cima
      39 = direita
      40 = baixo
      13 = OK/Enter
      27 = voltar/Escape
      8  = Backspace
    */

    if(
      key === 27 ||
      key === 8 ||
      key === "Escape"
    ){

      if(
        $("playerScreen")
          .style.display ===
          "block"
      ){

        e.preventDefault();

        fecharPlayer();

        return;

      }

    }

    /*
      BACK em algumas Smart TVs
      envia BrowserBack.
    */

    if(
      key === "BrowserBack" ||
      key === "GoBack"
    ){

      if(
        $("playerScreen")
          .style.display ===
          "block"
      ){

        e.preventDefault();

        fecharPlayer();

      }

      return;

    }

    /*
      HOME
    */

    if(
      key === "Home" ||
      key === 36
    ){

      if(
        $("playerScreen")
          .style.display ===
          "block"
      ){

        e.preventDefault();

        fecharPlayer();

      }
      else{

        window.scrollTo(
          0,
          0
        );

        $("categories")
          .scrollLeft = 0;

      }

      return;

    }

  }
);


/* =====================================================
   SETAS — NAVEGAÇÃO
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      $("playerScreen")
        .style.display ===
        "block"
    ){

      return;

    }

    var key =
      e.key ||
      e.keyCode;

    /*
      Se estiver pesquisando,
      não interferimos nas setas.
    */

    if(
      document.activeElement ===
      $("search")
    ){

      if(
        key === "ArrowDown" ||
        key === 40
      ){

        e.preventDefault();

        focarPrimeiroCard();

      }

      return;

    }

    var elemento =
      document.activeElement;

    /*
      CATEGORIAS
    */

    if(
      elemento &&
      elemento.className &&
      String(
        elemento.className
      ).indexOf(
        "categoryBtn"
      ) !== -1
    ){

      navegarCategorias(
        e
      );

      return;

    }

    /*
      CARDS
    */

    if(
      elemento &&
      elemento.className &&
      String(
        elemento.className
      ).indexOf(
        "card"
      ) !== -1
    ){

      navegarCards(
        e
      );

      return;

    }

  }
);


/* =====================================================
   NAVEGAR CATEGORIAS
===================================================== */

function navegarCategorias(e){

  var key =
    e.key ||
    e.keyCode;

  var botoes =
    $("categories")
      .getElementsByTagName(
        "button"
      );

  var atual =
    document.activeElement;

  var index = -1;

  var i;

  for(
    i=0;
    i<botoes.length;
    i++
  ){

    if(
      botoes[i] === atual
    ){

      index = i;

      break;

    }

  }

  if(
    key === "ArrowRight" ||
    key === 39
  ){

    e.preventDefault();

    if(
      index <
      botoes.length - 1
    ){

      botoes[index + 1]
        .focus();

      botoes[index + 1]
        .scrollIntoView({
          block:"nearest",
          inline:"center"
        });

    }

    return;

  }

  if(
    key === "ArrowLeft" ||
    key === 37
  ){

    e.preventDefault();

    if(index > 0){

      botoes[index - 1]
        .focus();

      botoes[index - 1]
        .scrollIntoView({
          block:"nearest",
          inline:"center"
        });

    }

    return;

  }

  if(
    key === "ArrowDown" ||
    key === 40
  ){

    e.preventDefault();

    focarPrimeiroCard();

    return;

  }

  if(
    key === "Enter" ||
    key === 13
  ){

    e.preventDefault();

    atual.click();

    return;

  }

}


/* =====================================================
   NAVEGAR CARDS
===================================================== */

function navegarCards(e){

  var key =
    e.key ||
    e.keyCode;

  var cards =
    $("conteudo")
      .getElementsByClassName(
        "card"
      );

  if(!cards.length)
    return;

  var atual =
    document.activeElement;

  var index = -1;

  var i;

  for(
    i=0;
    i<cards.length;
    i++
  ){

    if(
      cards[i] === atual
    ){

      index = i;

      break;

    }

  }

  /*
    Número aproximado de colunas.
    Usa a posição real dos cards para
    funcionar melhor em diferentes TVs.
  */

  var colunas =
    descobrirColunas(
      cards
    );

  var novo = index;

  if(
    key === "ArrowRight" ||
    key === 39
  ){

    novo =
      index + 1;

  }
  else if(
    key === "ArrowLeft" ||
    key === 37
  ){

    novo =
      index - 1;

  }
  else if(
    key === "ArrowDown" ||
    key === 40
  ){

    novo =
      index + colunas;

  }
  else if(
    key === "ArrowUp" ||
    key === 38
  ){

    novo =
      index - colunas;

  }
  else if(
    key === "Enter" ||
    key === 13
  ){

    e.preventDefault();

    if(atual){

      atual.click();

    }

    return;

  }
  else{

    return;

  }

  e.preventDefault();

  if(
    novo >= 0 &&
    novo < cards.length
  ){

    cards[novo].focus();

    cards[novo].scrollIntoView({
      block:"nearest",
      inline:"nearest"
    });

  }
  else if(
    key === "ArrowUp" ||
    key === 38
  ){

    focarUltimaCategoria();

  }

}


/* =====================================================
   DESCOBRIR COLUNAS
===================================================== */

function descobrirColunas(
  cards
){

  if(cards.length < 2)
    return 1;

  var primeiraLinhaY =
    cards[0]
      .getBoundingClientRect()
      .top;

  var count = 0;

  var i;

  for(
    i=0;
    i<cards.length;
    i++
  ){

    var y =
      cards[i]
        .getBoundingClientRect()
        .top;

    if(
      Math.abs(
        y -
        primeiraLinhaY
      ) < 10
    ){

      count++;

    }
    else{

      break;

    }

  }

  return count || 1;

}


/* =====================================================
   PRIMEIRO CARD
===================================================== */

function focarPrimeiroCard(){

  var cards =
    $("conteudo")
      .getElementsByClassName(
        "card"
      );

  if(cards.length){

    cards[0].focus();

    cards[0].scrollIntoView({
      block:"nearest"
    });

  }

}


/* =====================================================
   ÚLTIMA CATEGORIA
===================================================== */

function focarUltimaCategoria(){

  var botoes =
    $("categories")
      .getElementsByTagName(
        "button"
      );

  if(
    botoes.length
  ){

    botoes[
      botoes.length - 1
    ].focus();

  }

}


/* =====================================================
   FOCO INICIAL
===================================================== */

function iniciarControle(){

  setTimeout(
    function(){

      var botoes =
        $("categories")
          .getElementsByTagName(
            "button"
          );

      if(
        botoes.length
      ){

        botoes[0].focus();

      }

    },
    500
  );

}


/* =====================================================
   INICIALIZA
===================================================== */

carregar();

iniciarControle();


/* =====================================================
   ATUALIZAÇÃO AUTOMÁTICA
===================================================== */

setInterval(
  function(){

    canais.forEach(
      function(c){

        c.resolved =
          false;

      }
    );

    renderizar();

  },
  REFRESH_LIVE
);

</script>
